name: Publish update manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish into the update manifest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: x360-mobile-update-manifest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public distribution repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$MANUAL_TAG" > release.json
          else
            jq '.release' "$GITHUB_EVENT_PATH" > release.json
          fi
          release_tag="$(jq -r '.tag_name // empty' release.json)"
          if [[ -z "$release_tag" ]]; then
            echo "Release metadata does not contain a tag." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate release APK and metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_assets < <(
            jq -r '.assets[] | select(.name | endswith(".apk")) |
              [.name, .browser_download_url] | @tsv' release.json
          )
          if [[ "${#apk_assets[@]}" -ne 1 ]]; then
            echo "A release must contain exactly one APK asset." >&2
            exit 1
          fi
          IFS=$'\t' read -r apk_name apk_url <<<"${apk_assets[0]}"
          if [[ ! "$apk_name" =~ ^x360-mobile-[0-9A-Za-z.-]+\.apk$ ]]; then
            echo "Unexpected APK asset name: $apk_name" >&2
            exit 1
          fi
          curl --fail --location --retry 3 --output "$apk_name" "$apk_url"

          aapt_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name aapt -print |
              sort -V | tail -n 1
          )"
          if [[ -z "$aapt_path" ]]; then
            echo "aapt was not found on the GitHub runner." >&2
            exit 1
          fi
          package_line="$("$aapt_path" dump badging "$apk_name" | head -n 1)"
          # The package line also contains compileSdkVersionCodename='...'.
          # Anchor this match to the leading package field so a later name=
          # attribute can never be mistaken for the Android application ID.
          package_name="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$package_line")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$package_line")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$package_line")"
          if [[ "$package_name" != "emu.x360mobile.com" ]]; then
            echo "Unexpected application ID: $package_name" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Android versionCode: $version_code" >&2
            exit 1
          fi
          if [[ "$version_name" != "${{ steps.release.outputs.tag }}" &&
                "v$version_name" != "${{ steps.release.outputs.tag }}" ]]; then
            echo "Tag and APK versionName do not match." >&2
            exit 1
          fi

          prerelease="$(jq -r '.prerelease' release.json)"
          if [[ "$version_name" =~ -preview\.[0-9]+$ ]]; then
            channel=preview
            expected_prerelease=true
          elif [[ "$version_name" =~ -rc\.[0-9]+$ ]]; then
            channel=rc
            expected_prerelease=true
          elif [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-public\.[1-9][0-9]*)?$ ]]; then
            channel=public
            expected_prerelease=false
          else
            echo "Version does not follow the X360 Mobile release convention." >&2
            exit 1
          fi
          if [[ "$prerelease" != "$expected_prerelease" ]]; then
            echo "GitHub prerelease flag does not match version channel $channel." >&2
            exit 1
          fi

          jq -r '.body // ""' release.json > release-notes.md
          python tools/generate_update_manifest.py \
            --apk "$apk_name" \
            --version "$version_name" \
            --version-code "$version_code" \
            --download-url "$apk_url" \
            --page-url "$(jq -r '.html_url' release.json)" \
            --notes-file release-notes.md \
            --output update-manifest.json
          rm -f "$apk_name" release-notes.md release.json

      - name: Publish manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- update-manifest.json; then
            echo "Manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json
          git commit -m "Publish ${{ steps.release.outputs.tag }} update metadata"
          git push origin HEAD:main
