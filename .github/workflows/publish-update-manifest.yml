name: Publish update manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish into the update manifest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: x360-mobile-update-manifest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public distribution repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Test update versioning and manifest tools
        shell: bash
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$MANUAL_TAG" > release.json
          else
            jq '.release' "$GITHUB_EVENT_PATH" > release.json
          fi
          release_tag="$(jq -r '.tag_name // empty' release.json)"
          if [[ -z "$release_tag" ]]; then
            echo "Release metadata does not contain a tag." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate combined release APKs and metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_assets < <(
            jq -r '.assets[] | select(.name | endswith(".apk")) |
              [.name, .browser_download_url] | @tsv' release.json
          )
          if [[ "${#apk_assets[@]}" -ne 2 ]]; then
            echo "A combined release must contain exactly two APK assets." >&2
            exit 1
          fi
          host_name=""; host_url=""; controller_name=""; controller_url=""
          for asset in "${apk_assets[@]}"; do
            IFS=$'\t' read -r apk_name apk_url <<<"$asset"
            case "$apk_name" in
              x360-mobile-*.apk) host_name="$apk_name"; host_url="$apk_url" ;;
              x360-companion-*.apk) controller_name="$apk_name"; controller_url="$apk_url" ;;
              *) echo "Unexpected APK asset name: $apk_name" >&2; exit 1 ;;
            esac
          done
          if [[ -z "$host_name" || -z "$controller_name" ]]; then
            echo "Release must contain one emulator APK and one Companion APK." >&2
            exit 1
          fi
          curl --fail --location --retry 3 --output "$host_name" "$host_url"
          curl --fail --location --retry 3 --output "$controller_name" "$controller_url"

          aapt_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name aapt -print |
              sort -V | tail -n 1
          )"
          if [[ -z "$aapt_path" ]]; then
            echo "aapt was not found on the GitHub runner." >&2
            exit 1
          fi
          package_line="$("$aapt_path" dump badging "$host_name" | head -n 1)"
          # The package line also contains compileSdkVersionCodename='...'.
          # Anchor this match to the leading package field so a later name=
          # attribute can never be mistaken for the Android application ID.
          package_name="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$package_line")"
          version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$package_line")"
          version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$package_line")"
          if [[ "$package_name" != "emu.x360mobile.com" ]]; then
            echo "Unexpected application ID: $package_name" >&2
            exit 1
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Android versionCode: $version_code" >&2
            exit 1
          fi
          if [[ "v$version_name" != "${{ steps.release.outputs.tag }}" ]]; then
            echo "Tag and APK versionName do not match." >&2
            exit 1
          fi

          version_meta="$(
            python tools/x360_versioning.py describe "$version_name" "$version_code"
          )"
          channel="$(jq -r '.channel' <<<"$version_meta")"
          expected_prerelease="$(jq -r '.prerelease' <<<"$version_meta")"
          prerelease="$(jq -r '.prerelease' release.json)"
          if [[ "$prerelease" != "$expected_prerelease" ]]; then
            echo "GitHub prerelease flag does not match version channel $channel." >&2
            exit 1
          fi

          jq -r '.body // ""' release.json > release-notes.md
          python tools/generate_update_manifest.py \
            --apk "$host_name" \
            --version "$version_name" \
            --version-code "$version_code" \
            --download-url "$host_url" \
            --page-url "$(jq -r '.html_url' release.json)" \
            --notes-file release-notes.md \
            --output update-manifest.json
          controller_line="$("$aapt_path" dump badging "$controller_name" | head -n 1)"
          controller_package="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<<"$controller_line")"
          controller_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<<"$controller_line")"
          controller_version="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<<"$controller_line")"
          if [[ "$controller_package" != "emu.x360mobile.controller" || ! "$controller_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ || ! "$controller_code" =~ ^[1-9][0-9]*$ || "$controller_name" != "x360-companion-$controller_version.apk" ]]; then
            echo "Unexpected Companion package or version." >&2
            exit 1
          fi
          python tools/generate_controller_update_manifest.py \
            --apk "$controller_name" \
            --version "$controller_version" \
            --version-code "$controller_code" \
            --release-tag "${{ steps.release.outputs.tag }}" \
            --download-url "$controller_url" \
            --page-url "$(jq -r '.html_url' release.json)" \
            --output controller-update-manifest.json
          rm -f "$host_name" "$controller_name" release-notes.md release.json

      - name: Publish manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- update-manifest.json controller-update-manifest.json; then
            echo "Manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-manifest.json controller-update-manifest.json
          git commit -m "Publish ${{ steps.release.outputs.tag }} update metadata"
          git push origin HEAD:main
